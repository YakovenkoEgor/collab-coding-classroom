<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Java Classroom — Обучающиеся</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs/loader.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Java Classroom</div>
    <div class="user-info">
      <span id="whoami"></span>
      <button class="secondary" id="logout-btn">Выйти</button>
    </div>
  </div>

  <div id="notification-bar"></div>

  <div class="layout single wide">
    <div class="main">
      <div class="page-head">
        <a class="back-link" href="/teacher/dashboard">← Разделы</a>
        <div class="button-row">
          <a class="button-link" href="/students/new">+ Добавить / импортировать учеников</a>
          <a class="button-link secondary" href="/api/grades/export.csv" download>
            ↓ Выгрузить оценки
          </a>
          <a class="button-link secondary" href="/api/auth/users/export.csv" download
             title="Имя, фамилия, логин и пароль каждого ученика. Файл содержит пароли — храните его как документ с персональными данными.">
            ↓ Выгрузить логины
          </a>
        </div>
      </div>
      <div id="main-content"></div>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/teacher-core.js"></script>
  <script src="/js/pages/students.js"></script>
</body>
</html>
